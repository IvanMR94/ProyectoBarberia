<nav class="bg-white border-b border-sky-100 shadow-sm p-4">
  <div class="max-w-5xl mx-auto flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-600">BarberBook</h1>
    
    <div class="flex gap-6 items-center">
      <a routerLink="/barbers" routerLinkActive="text-blue-600 font-bold" class="text-blue-800 hover:text-blue-500 transition">Agenda</a>
      
      @if (isLoggedIn()) {
        @if (esBarbero()) {
          <a routerLink="/barber-dashboard" routerLinkActive="text-blue-600 font-bold" class="text-blue-800 hover:text-blue-500 transition">Dashboard</a>
        } @else {
          <a routerLink="/my-appointments" routerLinkActive="text-blue-600 font-bold" class="text-blue-800 hover:text-blue-500 transition">Mis Citas</a>
        }
        
        <button (click)="logout()" class="bg-red-50 text-red-600 px-4 py-1 rounded-full hover:bg-red-100 transition text-sm">
          Salir
        </button>
      } @else {
        <a routerLink="/login" class="bg-blue-600 text-white px-4 py-1 rounded-full hover:bg-blue-700 transition text-sm">
          Login
        </a>
      }
    </div>
  </div>
</nav>
