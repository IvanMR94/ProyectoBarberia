<section class="max-w-md mx-auto mt-16 p-8 bg-white rounded-3xl shadow-sm border border-sky-100">
  <h2 class="text-3xl font-bold text-blue-900 mb-2">Iniciar Sesión</h2>
  <p class="text-slate-500 mb-8">Accede para gestionar tus citas</p>
  
  <form (submit)="login()" class="space-y-5">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
      <input [(ngModel)]="credentials.username" name="username" required 
             class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
      <input [(ngModel)]="credentials.password" name="password" type="password" required 
             class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    
    <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 transition-all">
      Ingresar
    </button>
  </form>

  <p class="mt-6 text-center text-slate-500">
    ¿Aún no tienes cuenta? 
    <a routerLink="/register" class="text-blue-600 font-semibold hover:underline">Regístrate aquí</a>
  </p>
</section>
