<section class="max-w-md mx-auto mt-10 p-6 bg-white rounded-2xl shadow-sm border border-sky-100">
  <h2 class="text-2xl font-bold text-blue-900 mb-6">Crea tu cuenta</h2>
  
  <form (submit)="registrar()" class="space-y-4">
    <input [(ngModel)]="user.nombre" name="nombre" placeholder="Nombre" required class="w-full p-3 border rounded-xl">
    <input [(ngModel)]="user.apellido" name="apellido" placeholder="Apellido" required class="w-full p-3 border rounded-xl">
    <input [(ngModel)]="user.email" name="email" type="email" placeholder="Email" required class="w-full p-3 border rounded-xl">
    <input [(ngModel)]="user.password" name="password" type="password" placeholder="Contraseña (mínimo 8 caracteres)" minlength="8" required class="w-full p-3 border rounded-xl">
    
    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">
      Registrarse
    </button>
  </form>
</section>
