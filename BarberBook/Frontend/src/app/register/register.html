<section class="max-w-md mx-auto mt-10 p-6 sm:p-8 bg-tarjeta rounded-3xl border border-borde shadow-2xl">
  <h2 class="font-anton text-3xl uppercase tracking-wide text-hielo mb-6">Creá tu cuenta</h2>

  <form (submit)="registrar()" class="space-y-4">
    <input [(ngModel)]="user.nombre" name="nombre" placeholder="Nombre" required
           class="w-full p-4 bg-tinta border border-borde rounded-2xl text-hielo placeholder:text-hielo/30 focus:border-neon focus:outline-none transition-colors">
    <input [(ngModel)]="user.apellido" name="apellido" placeholder="Apellido" required
           class="w-full p-4 bg-tinta border border-borde rounded-2xl text-hielo placeholder:text-hielo/30 focus:border-neon focus:outline-none transition-colors">
    <input [(ngModel)]="user.email" name="email" type="email" placeholder="Email" required
           class="w-full p-4 bg-tinta border border-borde rounded-2xl text-hielo placeholder:text-hielo/30 focus:border-neon focus:outline-none transition-colors">
    <input [(ngModel)]="user.password" name="password" type="password" placeholder="Contraseña (mínimo 8 caracteres)" minlength="8" required
           class="w-full p-4 bg-tinta border border-borde rounded-2xl text-hielo placeholder:text-hielo/30 focus:border-neon focus:outline-none transition-colors">

    <button type="submit"
            class="w-full bg-neon text-tinta py-4 rounded-2xl font-montserrat font-bold uppercase tracking-wide hover:brightness-110 transition-all active:scale-[0.99]">
      Registrarse
    </button>
  </form>
</section>
