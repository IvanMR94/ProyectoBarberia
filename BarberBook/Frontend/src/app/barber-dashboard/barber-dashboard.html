<div class="max-w-4xl mx-auto p-6">
  <div class="flex items-center justify-between mb-8">
    <h2 class="text-3xl font-extrabold text-blue-950">Mi Agenda</h2>
    <button (click)="refreshDashboard()" 
            [disabled]="isLoading()"
            class="text-blue-600 hover:text-blue-800 font-medium text-sm transition-colors flex items-center gap-2">
      @if (isLoading()) { <span>Actualizando...</span> } 
      @else { <span>↻ Refrescar agenda</span> }
    </button>
  </div>
  
  <div class="space-y-4">
    @if (isLoading() && citas().length === 0) {
      <div class="text-center py-20">
        <div class="w-10 h-10 border-4 border-blue-100 border-t-blue-500 rounded-full animate-spin mx-auto"></div>
      </div>
    } @else {
      @for (cita of citas(); track cita.id) {
        <div class="bg-white p-6 rounded-2xl border border-blue-50 shadow-sm flex justify-between items-center hover:border-blue-200 transition-all">
          <div>
            <p class="text-xl font-bold text-blue-950 tracking-tight">
              {{ cita.fecha_hora_inicio | date:'dd/MM/yyyy HH:mm':'UTC' }}
            </p>
            <div class="mt-2">
              <span class="px-3 py-1 text-xs font-semibold rounded-full bg-sky-50 text-sky-700 border border-sky-200">
                {{ cita.estado }}
              </span>
            </div>
          </div>

          <button (click)="completarCita(cita.id)" 
                  [disabled]="isLoading()"
                  class="px-6 py-2.5 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition-all disabled:bg-blue-300 active:scale-95 shadow-sm shadow-blue-200">
            Finalizar Cita
          </button>
        </div>
      } @empty {
        <div class="text-center py-16 bg-blue-50 rounded-2xl border-2 border-dashed border-blue-200">
          <p class="text-blue-600 font-medium">No tienes citas pendientes por ahora.</p>
        </div>
      }
    }
  </div>
</div>
